<!DOCTYPE html>
<html>
<head>
    <title>Create Extension Icons</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            direction: rtl;
        }
        canvas {
            border: 1px solid #ccc;
            margin: 10px;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>ایجاد آیکون‌های افزونه</h1>
    <p>برای ایجاد آیکون‌ها، روی دکمه زیر کلیک کنید:</p>
    <button onclick="createIcons()">ایجاد آیکون‌ها</button>
    <div id="canvases"></div>
    
    <script>
        function createIcons() {
            const sizes = [16, 48, 128];
            const canvases = [];
            
            sizes.forEach(size => {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                
                // Background gradient
                const gradient = ctx.createLinearGradient(0, 0, size, size);
                gradient.addColorStop(0, '#667eea');
                gradient.addColorStop(1, '#764ba2');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, size, size);
                
                // Text
                ctx.fillStyle = 'white';
                ctx.font = `bold ${size * 0.4}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('ب', size / 2, size / 2);
                
                // Download
                canvas.toBlob(blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `icon${size}.png`;
                    a.click();
                    URL.revokeObjectURL(url);
                });
                
                document.getElementById('canvases').appendChild(canvas);
            });
            
            alert('آیکون‌ها دانلود شدند. آن‌ها را در پوشه icons قرار دهید.');
        }
    </script>
</body>
</html>
